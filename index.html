<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Imágenes con IA</title>

    <!-- TIPOGRAFÍAS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="portada">

        <!-- DECORACIÓN SUPERIOR IZQUIERDA -->

        <div class="decoracion-superior">
            <span>DISEÑO</span>
            <span>TECNOLOGÍA</span>
            <span>IDEAS</span>

            <div class="linea-decorativa"></div>
        </div>


        <!-- TÍTULO -->

        <h1 class="titulo-imagenes">
            Diseñadores
        </h1>

        <div class="titulo-con">
            VS
        </div>

        <div class="titulo-ia">
            IA
        </div>


        <!-- IMAGEN PRINCIPAL -->

        <img
            class="imagen-principal"
            src="imagenes/Imagen principal.png"
            alt=""
        >


        <!-- DECORACIÓN DERECHA -->

        <img
            class="deco-derecha"
            src="imagenes/Deco de la derecha.png"
            alt=""
        >


        <!-- DECORACIÓN IZQUIERDA -->

        <img
            class="deco-izquierda"
            src="imagenes/Deco de la izquierda.png"
            alt=""
        >


        <!-- RECORTE -->

        <section class="recorte">

            <h2>
                ¿HERRAMIENTA O REEMPLAZO?
            </h2>

        </section>


        <!-- TEXTO -->

        <p class="intro-trivia">
            Algunas imágenes fueron creadas con IA.<br>
            Otras, por diseñadoras. ¿Podés distinguirlas?
        </p>


        <!-- BOTÓN -->

        <a
            href="trivia.html"
            class="boton-trivia"
            aria-label="Poné a prueba tu mirada"
        >

            <span class="texto-boton">
                PONÉ A PRUEBA TU MIRADA
            </span>

            <span class="flecha" aria-hidden="true">
                <span class="flecha-linea"></span>
                <span class="flecha-punta"></span>
            </span>

        </a>

    </main>

</body>
</html>
